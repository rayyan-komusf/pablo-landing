name: Calidad landing
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # Fijo en 24.04: en ubuntu-latest (26.04 desde nov-2026) `npx playwright
    # install` falla con «Playwright does not support chromium on ubuntu26.04».
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/estudiante.spec.mjs
