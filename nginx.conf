server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativos (/cursos -> /cursos/) para que funcionen
    # detras de cualquier puerto o reverse proxy.
    absolute_redirect off;

    # El onboarding ahora es una página estática del propio sitio
    # (src/pages/onboarding), así que ya no se proxya a Vercel.

    # Assets con hash generados por Astro: cache inmutable.
    # El ^~ es necesario: sin él, el bloque de estáticos de abajo (que es una
    # regex, y las regex ganan) se comería estas rutas y perderían el header.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Estáticos: si no están, 404 de verdad. Mandarlos al home devolvería HTML
    # donde se espera una imagen, un script o un .txt — y eso rompe <img> y
    # <script>, ensucia el cacheo y le da basura a robots.txt y al sitemap.
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf|txt|xml|json|webmanifest)$ {
        try_files $uri =404;
    }

    # Páginas: la ruta que no exista se va al home en vez de mostrar el 404
    # pelado de nginx. 302 (temporal) a propósito: si mañana esa URL vuelve a
    # existir, nadie se queda con el redirect cacheado en el navegador.
    location / {
        try_files $uri $uri/ $uri.html @home;
    }

    location @home {
        return 302 /;
    }
}
