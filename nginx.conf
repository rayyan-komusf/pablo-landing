server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativos (/cursos -> /cursos/) para que funcionen
    # detras de cualquier puerto o reverse proxy.
    absolute_redirect off;

    # El onboarding ahora es una página estática del propio sitio
    # (src/pages/onboarding), así que ya no se proxya a Vercel.

    # Assets con hash generados por Astro: cache inmutable.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cualquier ruta que no exista sirve la 404 de Astro: la pantalla de carga
    # de Pablo, que redirige sola al home. Se sirve con status 404 DE VERDAD
    # (no un 302): así Google saca la URL muerta del índice, y el visitante
    # igual termina en el home. Redirigir con 200/302 sería un soft 404.
    error_page 404 /404.html;
}
